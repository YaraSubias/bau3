<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bauzik · find your music. Busca discos por artista, álbum, año y color, y escucha una muestra al abrirlos.">
<title>Bauzik · find your music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: catálogo de tienda de discos — barra de búsqueda arriba, panel de filtros (círculo cromático + vinilo) a la izquierda, cajón de portadas a la derecha. Los colores los ponen las portadas; la interfaz se tiñe del color elegido. */
:root{
  --bg:#e7e8ea; --surface:#f3f4f5; --surface-2:#dcdee1; --ink:#131417; --muted:#5b5f66; --line:#c9ccd1;
  --sel:#131417; --sel-ink:#f3f4f5;
  --vinyl:#151618; --groove:#232428;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#17181b; --surface-2:#202226; --ink:#eceef0; --muted:#9a9ea6; --line:#2c2f34;
  --sel:#eceef0; --sel-ink:#0f1012; --vinyl:#050506; --groove:#1a1b1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#17181b; --surface-2:#202226; --ink:#eceef0; --muted:#9a9ea6; --line:#2c2f34;
  --sel:#eceef0; --sel-ink:#0f1012; --vinyl:#050506; --groove:#1a1b1e; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

/* ---------- cabecera ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-left:.08em;vertical-align:.04em;background:conic-gradient(from 0deg,#f5d000,#f7a600,#f07d00,#e8481c,#d7191c,#b5176f,#6a2c91,#3b3c9c,#1f5fb0,#0e8f8a,#2e9b3e,#9bc31b,#f5d000)}
.brand p{margin:0;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px;min-width:0;max-width:640px}
.search:focus-within{border-color:var(--sel)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:none;font-size:15px}
.search input::placeholder{color:var(--muted)}
.clear-q{border:0;background:var(--surface-2);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
select.btn{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- cuerpo ---------- */
.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:28px;padding-block:24px 60px;align-items:start}
aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin;padding-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:15px;margin:0;letter-spacing:-.01em}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}
.tabs{display:none}

/* círculo cromático */
.wheel-box{position:relative;width:100%;max-width:300px;margin:4px auto 0;aspect-ratio:1}
.wheel{width:100%;height:100%;display:block;overflow:visible}
.wheel .seg{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:150px 150px}
.wheel .seg:hover{transform:scale(1.035)}
.wheel .seg.off{opacity:.18}
.wheel .seg path{stroke:var(--surface);stroke-width:1.2}
.wheel .seg.on path.ring-mid{stroke:var(--ink);stroke-width:2.2}
.wheel text.cnt{font-family:var(--font-mono);font-size:8.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.wheel-center{position:absolute;inset:33%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:4px}
.wheel-center b{font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1.15}
.wheel-center small{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.neutrals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 5px;font-size:12.5px;cursor:pointer;line-height:1.2}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);flex:none}
.chip em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);font-weight:600}
.chip.off{opacity:.4}
.mode{display:flex;justify-content:center;gap:4px;margin-top:12px;font-size:12px}
.mode button{border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* tocadiscos */
.deck{display:grid;grid-template-columns:1fr;justify-items:center;gap:8px}
.turntable{position:relative;width:min(100%,250px);aspect-ratio:1.12/1;border-radius:14px;background:linear-gradient(160deg,var(--surface-2),var(--bg));border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.record{position:absolute;left:5%;top:6%;width:80%;aspect-ratio:1;border-radius:50%;cursor:grab;outline-offset:4px;
  background:
   radial-gradient(circle at 50% 50%,transparent 0 31%,rgba(255,255,255,.06) 31.5%,transparent 32.5%),
   repeating-radial-gradient(circle at 50% 50%,var(--vinyl) 0 1.2px,var(--groove) 1.6px 2.4px),
   var(--vinyl);
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px #000}
.record:active{cursor:grabbing}
.record .sheen{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 12%,transparent 18% 50%,rgba(255,255,255,.1) 58%,transparent 64%);pointer-events:none}
.record .label{position:absolute;inset:32%;border-radius:50%;background:var(--sel);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.record .label::after{content:"";position:absolute;left:50%;top:50%;width:7%;height:7%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg)}
.year-readout{position:absolute;left:5%;top:6%;width:80%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9%;pointer-events:none;color:var(--sel-ink);text-align:center}
.year-readout b{font-family:var(--font-display);font-weight:800;font-size:clamp(15px,4.6vw,19px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.year-readout small{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.tonearm{position:absolute;right:4%;top:6%;width:30%;height:82%;pointer-events:none;overflow:visible}
.rpm{position:absolute;right:6%;bottom:6%;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0;max-width:30ch}
.window{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.window button{border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px;color:var(--muted)}
.window button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spectrum{width:100%;margin-top:6px}
.spectrum canvas{width:100%;height:96px;display:block;cursor:pointer;border-radius:6px}
.axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* resultados */
.results-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.count{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3vw,34px);letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
.count .n{font-variant-numeric:tabular-nums}
.active{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;min-height:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 10px;font-size:12.5px}
.pill i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.pill button{border:0;background:var(--surface-2);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;font-size:13px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{display:flex;flex-direction:column;gap:7px;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.cover{width:100%;max-width:100%;aspect-ratio:1;border-radius:4px;background-color:var(--surface-2);background-repeat:no-repeat;background-size:800% 800%;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 16px -8px rgba(0,0,0,.4);transition:transform .18s}
.card:hover .cover{transform:translateY(-3px)}
.card .t{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--muted);min-width:0}
.card .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .meta .yr{font-family:var(--font-mono);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;height:8px}
.dots i{flex:1;max-width:22px;border-radius:2px}
.more{display:flex;justify-content:center;margin-top:28px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--font-display);color:var(--ink);font-size:18px;margin-bottom:6px}

/* ficha */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,8,10,.6);backdrop-filter:blur(3px)}
.sheet{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;padding:24px;position:relative}
.sheet .cover{border-radius:6px}
.sheet h3{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3vw,26px);letter-spacing:-.02em;margin:4px 0 6px;line-height:1.1;text-wrap:balance}
.sheet .by{margin:0 0 4px;font-size:16px}
.sheet .cat{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:0 0 18px;font-variant-numeric:tabular-nums}
.sheet h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:500}
.palbar{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.palbar i{display:block}
.hexes{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 48px}
  aside.filters{position:static;max-height:none;overflow:visible}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px;font-weight:600;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .panel[data-tab]:not(.show){display:none}
  .wheel-box{max-width:270px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px}
  .sheet{grid-template-columns:minmax(0,1fr);padding:20px}
  .sheet .cover{max-width:300px}
  .top-actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* --- versión que lee el Word --- */
.cover{background-size:cover;background-position:center}
img.cover{display:block;object-fit:cover;background:var(--surface-2)}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.src b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22ch}
.loader{min-height:calc(100vh - 120px);display:grid;place-items:center;padding-block:32px}
.drop{width:min(640px,100%);border:2px dashed var(--line);border-radius:22px;background:var(--surface);padding:40px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--ink);background:var(--surface-2)}
.drop .disc{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--bg) 0 6%,transparent 6.5%),conic-gradient(from 0deg,#f5d000,#f7a600,#f07d00,#e8481c,#d7191c,#b5176f,#6a2c91,#3b3c9c,#1f5fb0,#0e8f8a,#2e9b3e,#9bc31b,#f5d000);box-shadow:inset 0 0 0 26px var(--vinyl),0 8px 24px rgba(0,0,0,.25)}
.drop.busy .disc{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drop h2{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3vw,26px);margin:0;letter-spacing:-.02em;text-wrap:balance}
.drop p{margin:0;color:var(--muted);max-width:46ch}
.drop code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:11px 20px;font-size:14px}
.progress{width:100%;max-width:360px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.err{color:#c0392b;font-weight:500}
.app[hidden]{display:none!important}

/* ===== Bauzik: diseño más limpio ===== */
.brand{flex-direction:row;align-items:baseline;gap:10px}
.brand h1{font-size:clamp(22px,2.4vw,28px)}
.brand .tagline{margin:0;font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
header.top{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.top .wrap{padding-block:12px}
.search{background:var(--surface);border-color:transparent;box-shadow:0 0 0 1px var(--line)}
.btn{background:transparent}
aside.filters{gap:30px}
.panel{background:transparent;border:0;border-radius:0;padding:0}
.panel + .panel{border-top:1px solid var(--line);padding-top:26px}
.panel-head{margin-bottom:6px;align-items:center}
.panel h2{font-family:var(--font-mono);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wheel-box{max-width:270px}
.wheel .seg path{stroke:var(--bg);stroke-width:0}
.wheel .seg:hover{transform:scale(1.04)}
.wheel .seg.on{transform:scale(1.07)}
.wheel .seg.on path.ring-mid{stroke:var(--ink);stroke-width:2.5}
.wheel .seg.off{opacity:.14}
.wheel text.cnt{display:none}
.wheel-center{inset:28%}
.wheel-center b{font-size:14px}
.chip{background:transparent;border-color:transparent;padding:4px 8px 4px 4px}
.chip em{display:none}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--ink)}
.neutrals{gap:2px 4px;margin-top:14px}
.mode{margin-top:14px}
.turntable{background:none;border:0;aspect-ratio:1.12/1}
.hint{font-size:12px}
.count{font-size:clamp(20px,2.3vw,28px);font-weight:700}
.results-head{align-items:baseline}
.src .sep{margin:0 8px;opacity:.6}
.src label.link{font-size:12px}
.grid{gap:26px 18px}
.cover{border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card:hover .cover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.card .t{font-size:13.5px}
dialog{overflow:auto}

/* ===== móvil: tira de colores fácil de tocar ===== */
.swatches{display:none}
.sw{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:4px 0;cursor:pointer;scroll-snap-align:start;font-size:11px;line-height:1.15;text-align:center;color:var(--ink)}
.sw i{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 16%,transparent);display:grid;place-items:center;transition:transform .15s}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink);transform:scale(.9)}
.sw[aria-pressed="true"] i::after{content:"";width:13px;height:7px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-2px) rotate(-45deg)}
.sw[aria-pressed="true"] span{font-weight:600}
.sw em{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.sw.off{opacity:.3}
@media (max-width:900px){
  .wheel-box,.neutrals{display:none}
  .swatches{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .swatches::-webkit-scrollbar{display:none}
  .panel + .panel{border-top:0;padding-top:0}
  .mode{justify-content:flex-start;margin-top:6px}
  .brand .tagline{font-size:12px}
  .src{width:100%}
}

/* ===== música ===== */
.listen .tracks{list-style:none;margin:0;padding:0;max-height:216px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tracks button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) 12px;align-items:center;gap:8px;border:0;background:transparent;padding:9px 12px;text-align:left;cursor:pointer;font-size:13.5px;color:var(--ink)}
.tracks li+li button{border-top:1px solid var(--line)}
.tracks button:hover{background:var(--surface-2)}
.tracks .tn{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tracks .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tracks .tp{width:0;height:0;border-left:8px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;justify-self:end}
.tracks button.now{background:var(--surface-2);font-weight:600}
.tracks button.now .tp{border-left-color:var(--ink)}
.listen a{color:inherit;text-underline-offset:3px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.pl-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.pl-disc{width:46px;height:46px;border-radius:50%;padding:0;border:0;background:var(--vinyl);flex:none;position:relative;cursor:pointer;box-shadow:0 0 0 3px var(--vinyl)}
.pl-disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pl-disc::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--vinyl)}
.player.playing .pl-disc{animation:spin 3.2s linear infinite}
.pl-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:5px}
.pl-bar i{display:block;height:100%;width:0;background:var(--ink)}
.pl-ctrl{display:flex;align-items:center;gap:6px;flex:none}
.pl-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.pl-btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pl-btn:disabled{opacity:.35;cursor:default}
.pl-link{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
body.has-player{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (max-width:560px){ .pl-link{display:none} .pl-btn{width:38px;height:38px} }

.wheel .seg:focus{outline:none}
.wheel .seg:focus-visible path{stroke:var(--ink);stroke-width:2.5}
.drop{border:0;background:transparent}

/* ===== paletas alternativas de móvil (vinilos / espectro) ===== */
.mpal,.cdetail{display:none}
.mpal button{border:0;padding:0;cursor:pointer;position:relative;background:none}
.mp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mp-vinyls > button{aspect-ratio:1;border-radius:50%;
  background:
   radial-gradient(circle,var(--bg) 0 5%,transparent 5.5%),
   radial-gradient(circle,var(--hi) 0 27%,rgba(0,0,0,.18) 28%,transparent 29.5%),
   conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.22) 14%,transparent 20% 52%,rgba(255,255,255,.16) 58%,transparent 64%),
   repeating-radial-gradient(circle,rgba(0,0,0,0) 0 1.4px,rgba(0,0,0,.13) 1.8px 2.2px),
   var(--c);
  box-shadow:0 3px 8px -3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.18);transition:transform .2s}
.mp-vinyls > button[aria-pressed="true"]{animation:spin 2.4s linear infinite;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink),0 8px 14px -6px rgba(0,0,0,.5)}
.mp-spec{display:grid;grid-template-columns:repeat(12,1fr);height:96px;align-items:end}
.mp-spec > button{height:72px;background:var(--c);transition:height .18s cubic-bezier(.3,.7,.3,1)}
.mp-spec > button:first-child{border-radius:12px 0 0 12px}.mp-spec > button:last-child{border-radius:0 12px 12px 0}
.mp-spec > button[aria-pressed="true"]{height:96px;border-radius:8px 8px 0 0;box-shadow:inset 0 -3px 0 0 var(--ink)}
.mp-spec > button[aria-pressed="true"]:first-child{border-radius:8px 8px 0 12px}.mp-spec > button[aria-pressed="true"]:last-child{border-radius:8px 8px 12px 0}
.mp-scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.mp-neut{display:grid;grid-template-columns:repeat(6,1fr);margin-top:8px;height:50px;align-items:end}
.mp-neut > button{height:40px;background:var(--c);transition:height .18s;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.mp-neut > button:first-child{border-radius:10px 0 0 10px}.mp-neut > button:last-child{border-radius:0 10px 10px 0}
.mp-neut > button[aria-pressed="true"]{height:50px;border-radius:6px 6px 0 0;box-shadow:inset 0 -3px 0 0 var(--ink)}
.mpal button.off{opacity:.3}
.cdetail{align-items:center;gap:10px;min-height:46px;margin-top:14px;padding:8px 12px;border-radius:12px;background:var(--surface)}
.cd-sw{display:flex;flex:none}
.cd-sw i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px rgba(0,0,0,.14)}
.cd-sw i+i{margin-left:-6px}
.cd-txt{flex:1;min-width:0;font-size:13px;line-height:1.25}
.cd-txt b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-txt span{color:var(--muted)}
.cd-num{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:none}
.cd-num small{font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-left:3px}
/* vinilos y espectro usan su paleta también en el ordenador (sin círculo) */
.mp-alt .wheel-box,.mp-alt .neutrals,.mp-alt .swatches{display:none}
.mp-alt .mpal{display:block;margin-top:4px}
.mp-alt .cdetail{display:flex}
@media (min-width:901px){ .mp-alt .mp-grid{gap:9px} .mp-alt .mpal{margin-top:8px} }

/* ===== versión espectro: selector de años ===== */
.ys-read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.ys-read b{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4vw,34px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ys-read span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ys-dec{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;column-gap:3px;height:96px;align-items:end}
.ys-dec button{border:0;padding:0;cursor:pointer;height:64px;border-radius:6px;transition:height .2s cubic-bezier(.3,.7,.3,1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ys-dec button.in{height:78px}
.ys-dec button[aria-pressed="true"]{height:96px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.ys-dec button:hover{filter:brightness(1.06)}
.ys-lab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.04em}
.spectrum canvas.scrub{height:104px;cursor:ew-resize;touch-action:none}

/* ===== versión vinilos: manchas de pintura en el disco ===== */
.splats{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.splat{position:absolute;transform:rotate(var(--rot)) scale(1);animation:splash .45s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.splat svg{width:100%;height:100%;display:block;overflow:visible}
.splat.bye{animation:unsplash .25s ease-in both}
@keyframes splash{0%{transform:rotate(var(--rot)) scale(.1);opacity:0}60%{opacity:1}100%{transform:rotate(var(--rot)) scale(1);opacity:1}}
@keyframes unsplash{to{transform:rotate(var(--rot)) scale(.6);opacity:0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Bauzik<span aria-hidden="true"></span></h1>
      <p class="tagline">find your music</p>
    </div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Busca un artista o un álbum…" autocomplete="off" spellcheck="false" disabled>
      <button class="clear-q" id="clearQ" type="button" hidden>Borrar</button>
    </label>
    <div class="top-actions">
      <select class="btn" id="sort" aria-label="Ordenar resultados">
        <option value="rel">Orden: relevancia</option>
        <option value="old">Más antiguos primero</option>
        <option value="new">Más recientes primero</option>
        <option value="az">Artista A–Z</option>
      </select>
      <button class="btn" id="shuffle" type="button">Uno al azar</button>
    </div>
  </div>
</header>

<!-- pantalla de carga: se ve mientras no hay Word -->
<main class="wrap loader" id="loader">
  <div class="drop" id="drop">
    <div class="disc" aria-hidden="true"></div>
    <h2 id="loadTitle">Bauzik</h2>
    <div class="progress" id="progress" hidden><i></i></div>
    <p id="loadStatus" aria-live="polite">Cargando los discos…</p>
  </div>
</main>

<main class="wrap layout app" id="app" hidden>
  <aside class="filters" aria-label="Filtros">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabColor" aria-selected="true" data-to="color">Color</button>
      <button role="tab" id="tabYear" aria-selected="false" data-to="year">Año</button>
    </div>

    <section class="panel show" data-tab="color" aria-labelledby="hColor">
      <div class="panel-head">
        <h2 id="hColor">Color</h2>
        <button class="link" id="clearColors" type="button" hidden>Quitar</button>
      </div>
      <div class="wheel-box">
        <svg class="wheel" id="wheel" viewBox="0 0 300 300" role="group" aria-label="Círculo cromático de 12 tonos"></svg>
        <div class="wheel-center" id="wheelCenter"><b>Elige</b><small>un color</small></div>
      </div>
      <div class="neutrals" id="neutrals" role="group" aria-label="Neutros y otros"></div>
      <div class="swatches" id="swatches" role="group" aria-label="Colores: desliza para ver todos"></div>
      <div class="mpal" id="mpal" role="group" aria-label="Colores"></div>
      <div class="cdetail" id="cdetail" aria-live="polite"></div>
      <div class="mode" role="group" aria-label="Cómo combinar los colores">
        <button type="button" id="modeAll" aria-pressed="true">Con todos</button>
        <button type="button" id="modeAny" aria-pressed="false">Con alguno</button>
      </div>
    </section>

    <section class="panel" data-tab="year" aria-labelledby="hYear">
      <div class="panel-head">
        <h2 id="hYear">Año</h2>
        <button class="link" id="clearYear" type="button" hidden>Quitar</button>
      </div>
      <div class="deck">
        <div class="turntable" id="turntable">
          <div class="record" id="record" tabindex="0" role="slider" aria-label="Año del álbum" aria-valuetext="Todos los años">
            <div class="sheen"></div><div class="label"></div><div class="splats" id="splats" aria-hidden="true"></div>
          </div>
          <div class="year-readout" aria-hidden="true"><b id="yearBig">GIRA</b><small id="yearSmall">el disco</small></div>
          <svg class="tonearm" viewBox="0 0 60 160" aria-hidden="true">
            <circle cx="44" cy="14" r="11" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
            <g id="arm" style="transform-origin:44px 14px;transition:transform .35s cubic-bezier(.3,.7,.3,1)">
              <path d="M44 14 L40 112 L22 138" fill="none" stroke="var(--muted)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="13" y="132" width="16" height="11" rx="2" transform="rotate(-36 21 137)" fill="var(--ink)"/>
            </g>
            <circle cx="44" cy="14" r="4" fill="var(--muted)"/>
          </svg>
        </div>
        <p class="hint">Gira el disco con el dedo o el ratón: hacia la derecha, años más recientes.</p>
        <div class="window" role="group" aria-label="Margen de años">
          <button type="button" data-w="0" aria-pressed="true">Solo ese año</button>
          <button type="button" data-w="2" aria-pressed="false">± 2 años</button>
          <button type="button" data-w="d" aria-pressed="false">Toda la década</button>
        </div>
      </div>
      <!-- versión espectro: décadas + franja, en lugar del tocadiscos -->
      <div class="ys" id="ys" hidden>
        <div class="ys-read"><b id="ysBig">Todos los años</b><span id="ysSmall"></span></div>
        <div class="ys-dec" id="ysDec" role="group" aria-label="Décadas"></div>
        <div class="ys-lab" id="ysLab" aria-hidden="true"></div>
      </div>
      <div class="spectrum">
        <p class="hint" id="specHint" style="margin:18px 0 6px;text-align:left;max-width:none">Cada raya es una portada, con su color principal. Toca un año.</p>
        <canvas id="spectrum" height="96" aria-label="Portadas por año, coloreadas por su color principal. Toca una columna para elegir ese año."></canvas>
        <div class="axis" id="axis"></div>
      </div>
    </section>
  </aside>

  <section aria-live="polite" aria-labelledby="count">
    <div class="results-head">
      <h2 class="count" id="count"><span class="n">—</span> portadas</h2>
      <p class="src" id="src"></p>
    </div>
    <div class="active" id="active"></div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn" id="moreBtn" type="button" hidden>Ver más portadas</button></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="sheet" id="sheet"></div>
</dialog>

<!-- minirreproductor: sigue sonando aunque cierres la ficha -->
<div class="player" id="player" hidden>
  <div class="wrap pl-in">
    <button class="pl-disc" id="plOpen" type="button" aria-label="Abrir la ficha del disco"><img id="plCover" alt=""></button>
    <div class="pl-info">
      <b id="plTrack">—</b>
      <span id="plAlbum">—</span>
      <div class="pl-bar" aria-hidden="true"><i id="plProg"></i></div>
    </div>
    <div class="pl-ctrl">
      <button class="pl-btn" id="plToggle" type="button" aria-label="Pausar"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path id="plIcon" d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg></button>
      <button class="pl-btn" id="plNext" type="button" aria-label="Siguiente canción"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7zM17 5h2.5v14H17z" fill="currentColor"/></svg></button>
      <a class="pl-link" id="plLink" href="#" target="_blank" rel="noopener">Apple Music</a>
      <button class="pl-btn ghost" id="plClose" type="button" aria-label="Parar la música"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Bauzik · find your music
   Lee la tabla del Word (Artista | Álbum | Portada | Año | Colores)
   y pone muestras de 30 s de Apple Music al abrir un disco
   ========================================================= */
const DEFAULT_FILE = 'Lista_albumes.docx';   // se busca junto a index.html y, si no está, en la carpeta de arriba
const MOBILE_STYLE = 'espectro';      // paleta en el móvil: 'tira', 'vinilos' o 'espectro'

/* ---------- vocabulario de color (el mismo del Word) ---------- */
const HUES = [
  ['amarillo','#f5d000'],['amarillo-naranja','#f7a600'],['naranja','#f07d00'],['rojo-naranja','#e8481c'],
  ['rojo','#d7191c'],['rojo-violeta','#b5176f'],['violeta','#6a2c91'],['azul-violeta','#3b3c9c'],
  ['azul','#1f5fb0'],['azul-verde','#0e8f8a'],['verde','#2e9b3e'],['amarillo-verde','#9bc31b']];
const NEUTRALS = [['blanco','#f7f7f4'],['gris','#9b9da1'],['negro','#121214'],['marrón','#7a4a25'],['beige','#d8c6a1'],['rosa','#f1a6be']];
const SWATCH = Object.fromEntries([...HUES,...NEUTRALS]);
const VOC = new Set(Object.keys(SWATCH));
const FIX = {'marron':'marrón','marrrón':'marrón','amarilllo':'amarillo','amarilo-verde':'amarillo-verde','ayul-verde':'azul-verde',
  'morado':'violeta','lila':'violeta','purpura':'violeta','púrpura':'violeta','azul oscuro':'azul','azul claro':'azul','celeste':'azul',
  'crema':'beige','dorado':'amarillo-naranja','plateado':'gris','plata':'gris','rosado':'rosa','fucsia':'rojo-violeta','magenta':'rojo-violeta',
  'turquesa':'azul-verde','verde oscuro':'verde','granate':'rojo','burdeos':'rojo','ocre':'amarillo-naranja','amarillo verde':'amarillo-verde'};
const label = c => c.charAt(0).toUpperCase()+c.slice(1);
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function parseColors(s){
  const out=[];
  s.toLowerCase().replace(/\./g,',').split(/,|;|\/|\by\b/).forEach(p=>{
    p=p.trim(); if(!p) return;
    const cand = (FIX[p]||VOC.has(p)) ? [FIX[p]||p] : p.split(/\s+/).map(w=>FIX[w]||w);
    cand.forEach(c=>{ if(VOC.has(c) && !out.includes(c)) out.push(c); });
  });
  return out;
}
const cleanTitle = a => { a=a.trim(); if(a==='1995:03:00') return '3'; return a.replace(/^\d{4}\s*:\s*/,'').replace(/\(\s*\d{4}\s*\)\s*$/,'').trim(); };

/* ---------- utilidades de color ---------- */
const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (h,t,amt) => { const a=hex2rgb(h), b=hex2rgb(t); return rgb2hex(a.map((v,i)=>v+(b[i]-v)*amt)); };
const lum = h => { const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; };
const inkOn = h => lum(h)>.36 ? '#121214' : '#f6f6f4';
const esc = s => String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* =========================================================
   1. LEER EL WORD
   ========================================================= */
let ZIP=null, ALBUMS=[], SOURCE={name:'',date:null};
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const R_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const A_NS='http://schemas.openxmlformats.org/drawingml/2006/main';
const PKG_NS='http://schemas.openxmlformats.org/package/2006/relationships';

async function readDocx(data, name, date){
  setLoading(true,'Abriendo el Word…',5);
  const zip = await JSZip.loadAsync(data);
  const docXml = await zip.file('word/document.xml')?.async('string');
  if(!docXml) throw new Error('Este archivo no parece un Word (.docx).');
  setLoading(true,'Leyendo la tabla…',35);
  const relXml = await zip.file('word/_rels/document.xml.rels')?.async('string') || '';
  const rels={};
  const relDoc=new DOMParser().parseFromString(relXml,'application/xml');
  for(const r of relDoc.getElementsByTagNameNS(PKG_NS,'Relationship')){
    let t=r.getAttribute('Target'); t = t.startsWith('/') ? t.slice(1) : 'word/'+t.replace(/^\.\//,'');
    rels[r.getAttribute('Id')]=t;
  }
  const doc=new DOMParser().parseFromString(docXml,'application/xml');
  const tables=[...doc.getElementsByTagNameNS(W_NS,'tbl')];
  if(!tables.length) throw new Error('No he encontrado ninguna tabla en el Word.');
  const tbl=tables.sort((a,b)=>b.getElementsByTagNameNS(W_NS,'tr').length-a.getElementsByTagNameNS(W_NS,'tr').length)[0];
  const text = el => [...el.getElementsByTagNameNS(W_NS,'t')].map(t=>t.textContent).join('').trim();
  const rows=[...tbl.children].filter(n=>n.localName==='tr');
  // columnas por la cabecera (por si cambian de orden)
  const head=[...rows[0].children].filter(n=>n.localName==='tc').map(c=>norm(text(c)));
  const col = (keys,def) => { const i=head.findIndex(h=>keys.some(k=>h.includes(k))); return i>=0?i:def; };
  const cA=col(['artista'],0), cT=col(['album'],1), cP=col(['portada','imagen','foto'],2), cY=col(['ano','year','fecha'],3), cC=col(['color'],4);
  const out=[];
  rows.slice(1).forEach(tr=>{
    const tcs=[...tr.children].filter(n=>n.localName==='tc');
    if(tcs.length<2) return;
    const artist=text(tcs[cA]||tcs[0]), raw=text(tcs[cT]||tcs[1]);
    if(!artist || !raw) return;                        // filas sin álbum: se ignoran
    const blip = tcs[cP] ? tcs[cP].getElementsByTagNameNS(A_NS,'blip')[0] : null;
    const rid = blip ? (blip.getAttributeNS(R_NS,'embed')||blip.getAttribute('r:embed')) : null;
    const yTxt = tcs[cY] ? text(tcs[cY]) : '';
    const ym = yTxt.match(/\d{4}/) || raw.match(/\((\d{4})\)/) || raw.match(/^(\d{4}):/);
    const colors = tcs[cC] ? parseColors(text(tcs[cC])) : [];
    out.push({ a:artist, t:cleanTitle(raw)||raw, y: ym ? +(ym[1]||ym[0]) : null, c:colors, img: rid ? rels[rid] : null });
  });
  if(!out.length) throw new Error('La tabla no tiene filas con artista y álbum.');
  ZIP=zip; SOURCE={name, date};
  out.forEach((a,i)=>{ a.id=i; a.key=norm(a.a+' '+a.t); a.dom=a.c.length?SWATCH[a.c[0]]:'#888888'; });
  ALBUMS=out;
  setLoading(true,`${out.length} álbumes leídos`,100);
  startApp();
}

/* portadas: se sacan del Word solo cuando hacen falta */
const urlCache=new Map();
async function coverURL(a){
  if(!a.img) return null;
  if(urlCache.has(a.id)) return urlCache.get(a.id);
  const f=ZIP.file(a.img); if(!f) return null;
  const p=f.async('blob').then(b=>URL.createObjectURL(b.type?b:new Blob([b],{type:/\.png$/i.test(a.img)?'image/png':'image/jpeg'})));
  urlCache.set(a.id,p); return p;
}
/* color principal real de cada portada (en segundo plano, para el espectro y la ficha) */
async function analyse(a, k=5){
  const url=await coverURL(a); if(!url) return null;
  const img=new Image(); img.decoding='async'; img.src=url; await img.decode();
  const S=40, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
  const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0,S,S);
  const d=ctx.getImageData(0,0,S,S).data, px=[];
  for(let i=0;i<d.length;i+=4) px.push([d[i],d[i+1],d[i+2]]);
  // k-medias sencillo
  let cents=[...Array(k)].map((_,j)=>px[Math.floor((j+.5)*px.length/k)].slice());
  let lab=new Array(px.length).fill(0);
  for(let it=0;it<8;it++){
    const sum=cents.map(()=>[0,0,0,0]);
    px.forEach((p,i)=>{ let best=0,bd=1e9; cents.forEach((c,j)=>{const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2; if(dd<bd){bd=dd;best=j;}}); lab[i]=best; const s=sum[best]; s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++; });
    cents=sum.map((s,j)=>s[3]?[s[0]/s[3],s[1]/s[3],s[2]/s[3]]:cents[j]);
  }
  const cnt=cents.map((_,j)=>lab.filter(l=>l===j).length/px.length);
  a.pal=cents.map((c,j)=>[rgb2hex(c),cnt[j]]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);
  a.dom=a.pal[0][0];
  return a.pal;
}
async function analyseAll(){
  const queue=ALBUMS.filter(a=>a.img && !a.pal);
  let n=0;
  const worker=async()=>{ while(queue.length){ const a=queue.shift(); try{ await analyse(a,4); }catch(e){} if(++n%60===0) drawSpectrum(); await new Promise(r=>setTimeout(r,0)); } };
  await Promise.all([worker(),worker()]);
  drawSpectrum();
}

/* =========================================================
   2. PANTALLA DE CARGA (el Word es fijo: se carga solo, sin opción de cambiarlo)
   ========================================================= */
const loader=document.getElementById('loader'), app=document.getElementById('app'), drop=document.getElementById('drop');
function setLoading(busy,msg,pct){
  drop.classList.toggle('busy',busy);
  document.getElementById('loadStatus').textContent=msg||'';
  const pr=document.getElementById('progress'); pr.hidden=pct==null; if(pct!=null) pr.firstElementChild.style.width=pct+'%';
}
function showError(msg){
  setLoading(false,'',null);
  document.getElementById('loadTitle').textContent='No se ha podido abrir la colección';
  document.getElementById('loadStatus').innerHTML=`<span class="err">${esc(msg)}</span>`;
  loader.hidden=false; app.hidden=true;
}
async function boot(){
  const local = location.protocol==='file:';
  try{
    setLoading(true,'Cargando los discos…',0);
    let r=await fetch(DEFAULT_FILE);
    if(r.status===404){ const up=await fetch('../'+DEFAULT_FILE).catch(()=>null); if(up&&up.ok) r=up; }
    if(!r.ok) throw new Error(r.status===404?'missing':'http');
    const total=+r.headers.get('content-length')||0; let got=0; const chunks=[];
    const rd=r.body.getReader();
    for(;;){ const {done,value}=await rd.read(); if(done) break; chunks.push(value); got+=value.length;
      setLoading(true,`Cargando los discos… ${Math.round(got/1048576)}${total?' de '+Math.round(total/1048576):''} MB`, total?got/total*90:null); }
    const lm=r.headers.get('last-modified');
    await readDocx(new Blob(chunks), DEFAULT_FILE, lm?new Date(lm):null);
  }catch(e){
    if(local) showError(`Has abierto index.html directamente desde el ordenador y el navegador no deja leer ${DEFAULT_FILE} así. Ábrela desde la web publicada (GitHub Pages).`);
    else if(e.message==='missing') showError(`Falta el archivo ${DEFAULT_FILE} junto a index.html. Súbelo a la misma carpeta con ese nombre exacto.`);
    else showError(e.message && !['http','Failed to fetch'].includes(e.message) ? e.message : 'Ha fallado la conexión. Recarga la página para volver a intentarlo.');
  }
}

const state = { q:'', colors:[], mode:'all', year:null, win:0, sort:'rel', shown:0 };
const PAGE = 120;
let YMIN=1960, YMAX=2030, byYear={}, maxY=1, current=[];

function startApp(){
  urlCache.forEach(p=>p.then(u=>u&&URL.revokeObjectURL(u))); urlCache.clear();
  const ys=ALBUMS.map(a=>a.y).filter(Boolean); YMIN=Math.min(...ys); YMAX=Math.max(...ys);
  byYear={}; ALBUMS.forEach(a=>{ if(a.y)(byYear[a.y]=byYear[a.y]||[]).push(a); });
  maxY=Math.max(1,...Object.values(byYear).map(l=>l.length));
  const ax=[YMIN, Math.round(YMIN+(YMAX-YMIN)/3), Math.round(YMIN+2*(YMAX-YMIN)/3), YMAX];
  document.getElementById('axis').innerHTML=ax.map(y=>`<span>${y}</span>`).join('');
  const record=document.getElementById('record'); record.setAttribute('aria-valuemin',YMIN); record.setAttribute('aria-valuemax',YMAX);
  buildDecades();
  const artists=new Set(ALBUMS.map(a=>a.a));
  const d=SOURCE.date && !isNaN(SOURCE.date) ? ' · '+SOURCE.date.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) : '';
  document.getElementById('src').innerHTML=`${ALBUMS.length.toLocaleString('es-ES')} discos · ${artists.size} artistas · ${YMIN}–${YMAX}`;
  Object.assign(state,{q:'',colors:[],year:null,shown:0}); document.getElementById('q').value=''; document.getElementById('q').disabled=false;
  loader.hidden=true; app.hidden=false; setLoading(false,'',null);
  update();
  setTimeout(analyseAll,800);
}

function setAccent(){
  const root=document.documentElement.style, c=state.colors[state.colors.length-1];
  if(c){ root.setProperty('--sel',SWATCH[c]); root.setProperty('--sel-ink',inkOn(SWATCH[c])); }
  else { root.removeProperty('--sel'); root.removeProperty('--sel-ink'); }
}
function yearRange(){
  if(state.year==null) return null;
  if(state.win==='d'){ const d=Math.floor(state.year/10)*10; return [d,d+9]; }
  return [state.year-state.win, state.year+state.win];
}
const passText = a => !state.q || state.q.split(/\s+/).every(t=>a.key.includes(t));
const passYear = a => { const r=yearRange(); return !r || (a.y>=r[0] && a.y<=r[1]); };
function passColor(a, colors=state.colors){
  if(!colors.length) return true;
  return state.mode==='all' ? colors.every(c=>a.c.includes(c)) : colors.some(c=>a.c.includes(c));
}
/* relevancia: en el Word los colores van de más a menos presente */
const score = a => state.colors.reduce((s,c)=>{ const i=a.c.indexOf(c); return s + (i<0?0:1/(1+i)); },0);
function filtered(){
  const list=ALBUMS.filter(a=>passText(a)&&passYear(a)&&passColor(a));
  const byArtist=(x,y)=>x.a.localeCompare(y.a,'es')||(x.y||0)-(y.y||0);
  if(state.sort==='old') list.sort((x,y)=>(x.y||9999)-(y.y||9999)||byArtist(x,y));
  else if(state.sort==='new') list.sort((x,y)=>(y.y||0)-(x.y||0)||byArtist(x,y));
  else if(state.sort==='az') list.sort(byArtist);
  else if(state.colors.length) list.sort((x,y)=>score(y)-score(x)||(x.y||0)-(y.y||0));
  else if(state.year!=null) list.sort((x,y)=>(x.y||0)-(y.y||0)||byArtist(x,y));
  else list.sort(byArtist);
  return list;
}

/* ---------- render ---------- */
const grid=document.getElementById('grid'), moreBtn=document.getElementById('moreBtn');
function cardHTML(a){
  return `<button class="card" type="button" data-id="${a.id}" aria-label="${esc(a.t)}, de ${esc(a.a)}${a.y?', '+a.y:''}">
    <img class="cover" alt="" data-cover="${a.id}" loading="lazy" decoding="async">
    <div class="t">${esc(a.t)}</div>
    <div class="meta"><span>${esc(a.a)}</span><span class="yr">${a.y||'—'}</span></div></button>`;
}
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; const img=e.target; io.unobserve(img);
  coverURL(ALBUMS[+img.dataset.cover]).then(u=>{ if(u) img.src=u; }); }),{rootMargin:'400px'});
function renderMore(){
  const next=current.slice(state.shown,state.shown+PAGE);
  grid.insertAdjacentHTML('beforeend',next.map(cardHTML).join(''));
  grid.querySelectorAll('img[data-cover]:not([src])').forEach(img=>io.observe(img));
  state.shown+=next.length;
  moreBtn.hidden=state.shown>=current.length;
  moreBtn.textContent=`Ver más portadas (${(current.length-state.shown).toLocaleString('es-ES')} más)`;
}
function describe(n){
  const parts=[];
  if(state.colors.length) parts.push('con '+state.colors.join(state.mode==='all'?' y ':' o '));
  const r=yearRange(); if(r) parts.push(r[0]===r[1]?`de ${r[0]}`:`de ${r[0]} a ${r[1]}`);
  if(state.q) parts.push(`que coinciden con «${esc(document.getElementById('q').value.trim())}»`);
  return `<span class="n">${n.toLocaleString('es-ES')}</span> ${n===1?'portada':'portadas'}${parts.length?' '+parts.join(', '):''}`;
}
function renderActive(){
  const bits=[];
  state.colors.forEach(c=>bits.push(`<span class="pill"><i style="background:${SWATCH[c]}"></i>${label(c)}<button type="button" data-rm-color="${c}" aria-label="Quitar ${c}">×</button></span>`));

  if(state.q) bits.push(`<span class="pill">«${esc(document.getElementById('q').value.trim())}»<button type="button" data-rm-q aria-label="Quitar la búsqueda">×</button></span>`);
  document.getElementById('active').innerHTML=bits.join('');
}
function update(){
  current=filtered(); state.shown=0; grid.innerHTML='';
  document.getElementById('count').innerHTML=describe(current.length);
  if(!current.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>No hay portadas así</b>Prueba con «Con alguno», quita un color o amplía el margen de años.</div>`; moreBtn.hidden=true; }
  else renderMore();
  renderActive(); updateWheelCounts(); drawSpectrum(); setAccent(); updateYearUI(); renderSplats();
  document.getElementById('clearColors').hidden=!state.colors.length;
  document.getElementById('clearYear').hidden=state.year==null;
  document.getElementById('clearQ').hidden=!state.q;

moreBtn.addEventListener('click',renderMore);
new IntersectionObserver(es=>{ if(es[0].isIntersecting && !moreBtn.hidden && !app.hidden) renderMore(); },{rootMargin:'600px'}).observe(moreBtn);

/* ---------- círculo cromático ---------- */
const wheel=document.getElementById('wheel'), NS='http://www.w3.org/2000/svg', CX=150, CY=150;
function arc(r0,r1,a0,a1){
  const p=(r,a)=>[CX+r*Math.sin(a),CY-r*Math.cos(a)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3}Z`;
}
const segEls={}, cntEls={};
HUES.forEach(([name,hex],i)=>{
  const step=Math.PI*2/12, a0=i*step-step/2+0.02, a1=(i+1)*step-step/2-0.02;
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','seg'); g.setAttribute('role','button'); g.setAttribute('tabindex','0');
  g.setAttribute('aria-label',label(name)); g.setAttribute('aria-pressed','false'); g.dataset.color=name;
  [[70,132,hex,'ring-mid']].forEach(([r0,r1,fill,cls])=>{
    const p=document.createElementNS(NS,'path'); p.setAttribute('d',arc(r0,r1,a0,a1)); p.setAttribute('fill',fill); p.setAttribute('class',cls); g.appendChild(p);
  });
  const t=document.createElementNS(NS,'title'); t.textContent=label(name); g.appendChild(t);
  wheel.appendChild(g); segEls[name]=g;
  const am=(a0+a1)/2, ct=document.createElementNS(NS,'text');
  ct.setAttribute('x',CX+141*Math.sin(am)); ct.setAttribute('y',CY-141*Math.cos(am)); ct.setAttribute('class','cnt'); wheel.appendChild(ct); cntEls[name]=ct;
});
const neutralsEl=document.getElementById('neutrals');
NEUTRALS.forEach(([name,hex])=>{

  b.innerHTML=`<i style="background:${hex}"></i>${label(name)} <em></em>`; neutralsEl.appendChild(b); segEls[name]=b; cntEls[name]=b.querySelector('em');

function renderColorDetail(){

function updateWheelCounts(){
  const base=ALBUMS.filter(a=>passText(a)&&passYear(a));

/* ---------- tocadiscos ---------- */
const record=document.getElementById('record'), arm=document.getElementById('arm');
let angle=0, acc=0, dragging=false, lastA=0;
const DEG_PER_YEAR=14, clampY=y=>Math.min(YMAX,Math.max(YMIN,y)), midY=()=>Math.round((YMIN+YMAX)/2);
const spin=k=>{ angle+=k*DEG_PER_YEAR; record.style.transform=`rotate(${angle}deg)`; };
function centerAngle(e){ const r=record.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI; }
record.addEventListener('pointerdown',e=>{ dragging=true; lastA=centerAngle(e); record.setPointerCapture(e.pointerId); if(state.year==null) setYear(midY()); });
record.addEventListener('pointermove',e=>{
  if(!dragging) return; let a=centerAngle(e), d=a-lastA; if(d>180)d-=360; if(d<-180)d+=360; lastA=a;
  angle+=d; acc+=d; record.style.transform=`rotate(${angle}deg)`;
  const steps=Math.trunc(acc/DEG_PER_YEAR); if(steps){ acc-=steps*DEG_PER_YEAR; setYear(clampY((state.year??midY())+steps),true); }
});
['pointerup','pointercancel'].forEach(t=>record.addEventListener(t,()=>{ dragging=false; acc=0; }));
record.addEventListener('keydown',e=>{
  const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:10,PageDown:-10}[e.key];
  if(k){ e.preventDefault(); spin(k); setYear(clampY((state.year??midY())+k)); }

    const score={};
    ALBUMS.forEach(a=>{ if(a.y>=d&&a.y<=d+9) a.c.forEach((c,i)=>{ score[c]=(score[c]||0)+1/(1+i); }); });

    const wheelOrder=HUES.map(h=>h[0]);

const SPLATS = MOBILE_STYLE==='vinilos';

function seeded(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } h>>>=0; if(!h) h=1;
  return ()=>{ h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; return (h%100000)/100000; }; }
function splatSVG(c){
  const rnd=seeded('mancha-'+c), hex=SWATCH[c], N=16, P=[];
  for(let i=0;i<N;i++){ const a=i/N*Math.PI*2+rnd()*.25; let r=24*(.72+rnd()*.42); if(rnd()<.25) r*=1.35;
    P.push([50+r*Math.cos(a),50+r*Math.sin(a)]); }
  const mid=(p,q)=>`${((p[0]+q[0])/2).toFixed(1)},${((p[1]+q[1])/2).toFixed(1)}`;
  let d=`M${mid(P[N-1],P[0])}`; for(let i=0;i<N;i++) d+=` Q${P[i][0].toFixed(1)},${P[i][1].toFixed(1)} ${mid(P[i],P[(i+1)%N])}`; d+='Z';
  let drops='';
  const nd=4+Math.floor(rnd()*4);
  for(let i=0;i<nd;i++){ const a=rnd()*Math.PI*2, dist=30+rnd()*16, r=1.4+rnd()*4;
    drops+=`<circle cx="${(50+dist*Math.cos(a)).toFixed(1)}" cy="${(50+dist*Math.sin(a)).toFixed(1)}" r="${r.toFixed(1)}" fill="${hex}"/>`;
    if(rnd()<.5){ const d2=dist-6-rnd()*4; drops+=`<circle cx="${(50+d2*Math.cos(a)).toFixed(1)}" cy="${(50+d2*Math.sin(a)).toFixed(1)}" r="${(r*.55).toFixed(1)}" fill="${hex}"/>`; } }
  const hl=`<ellipse cx="${(44+rnd()*6).toFixed(1)}" cy="${(42+rnd()*6).toFixed(1)}" rx="${(7+rnd()*4).toFixed(1)}" ry="${(3+rnd()*2).toFixed(1)}" fill="#fff" opacity=".22" transform="rotate(${Math.round(rnd()*80-40)} 50 50)"/>`;
  const edge = c==='blanco' ? ' stroke="rgba(0,0,0,.18)" stroke-width=".6"' : '';
  return { svg:`<svg viewBox="0 0 100 100"><path d="${d}" fill="${hex}"${edge}/>${drops}${hl}</svg>`, rnd };
}
function renderSplats(){
  if(!SPLATS) return;
  const box=document.getElementById('splats');

  state.colors.forEach((c,i)=>{

  spec.width=w*dpr; spec.height=h*dpr; const ctx=spec.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);

const audio=new Audio(); audio.preload='none';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';

const PLAY={album:null, tracks:[], idx:0, url:''};
const musicCache=new Map();
const simple=s=>norm(s).replace(/\(.*?\)|\[.*?\]/g,' ').replace(/ - (single|ep)\b.*$/,'').replace(/[^a-z0-9]+/g,' ').trim();
function similar(a,b){ a=simple(a); b=simple(b); if(!a||!b) return 0; if(a===b) return 1; if(a.includes(b)||b.includes(a)) return .85;
  const A=new Set(a.split(' ')), B=new Set(b.split(' ')); let i=0; A.forEach(w=>{ if(B.has(w)) i++; }); return i/Math.max(A.size,B.size); }

    const j=await itunes(`search?entity=album&limit=20&country=es&term=${term}`);
    let best=null, bs=0;
    for(const c of j.results||[]){ const s=similar(c.collectionName,a.t)*.65+similar(c.artistName,a.a)*.35; if(s>bs){ bs=s; best=c; } }
    if(best && bs>=.6){
      const l=await itunes(`lookup?id=${best.collectionId}&entity=song&country=es`);
      const tracks=(l.results||[]).filter(x=>x.wrapperType==='track'&&x.previewUrl)
        .sort((x,y)=>(x.discNumber-y.discNumber)||(x.trackNumber-y.trackNumber)).map(s=>({n:s.trackName,u:s.previewUrl}));
      if(tracks.length) return {url:best.collectionViewUrl, name:best.collectionName, tracks};
    }
    /* plan B: canciones sueltas del disco */
    const k=await itunes(`search?entity=song&limit=25&country=es&term=${term}`);
    const songs=(k.results||[]).filter(s=>s.previewUrl && similar(s.artistName,a.a)>=.5 && similar(s.collectionName,a.t)>=.5);
    if(!songs.length) return null;
    return {url:songs[0].collectionViewUrl, name:songs[0].collectionName, tracks:songs.map(s=>({n:s.trackName,u:s.previewUrl}))};
  })().catch(()=>({error:true}));

}
const searchLinks=a=>{ const q=encodeURIComponent(`${a.a} ${a.t}`); return `<a class="btn" href="https://music.apple.com/es/search?term=${q}" target="_blank" rel="noopener">Apple Music</a><a class="btn" href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">Spotify</a><a class="btn" href="https://music.youtube.com/search?q=${q}" target="_blank" rel="noopener">YouTube Music</a>`; };

audio.addEventListener('timeupdate',()=>{ if(audio.duration) document.getElementById('plProg').style.width=(audio.currentTime/audio.duration*100)+'%'; });
document.getElementById('plToggle').addEventListener('click',()=>{ if(audio.paused){ const p=audio.play(); if(p) p.catch(()=>{}); } else audio.pause(); });
document.getElementById('plNext').addEventListener('click',()=>playTrack(PLAY.idx+1));
document.getElementById('plClose').addEventListener('click',()=>{ audio.pause(); PLAY.album=null; renderPlayer(); });
document.getElementById('plOpen').addEventListener('click',()=>{ if(PLAY.album) openAlbum(PLAY.album.id,false); });

boot();
</script>

</body>
</html>
